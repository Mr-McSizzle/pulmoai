services:
  pulmoai:
    build: .
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - patient_data:/var/lib/pulmoai
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  patient_data:
